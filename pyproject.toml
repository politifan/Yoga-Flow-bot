[project]
name = "yoga-flow-bot"
version = "0.1.0"
description = "Integration service for Yoga Flow: FastAPI + Aiogram gateway to Core API and payment provider."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yoga Flow Team" }]
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.24.0.post1",
  "aiogram==3.4.1",
  "httpx==0.27.0",
  "pydantic==2.5.1",
  "pydantic-settings==2.1.0",
  "python-dotenv==1.0.1"
]

[tool.uvicorn]
factory = true
